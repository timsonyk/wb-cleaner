services:
  postgres:
    image: postgres:16-alpine
    container_name: wb_cleaner_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wb_cleaner}
      POSTGRES_USER: ${POSTGRES_USER:-wb_cleaner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wb_cleaner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wb_cleaner} -d ${POSTGRES_DB:-wb_cleaner}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
